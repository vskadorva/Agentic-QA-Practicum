name: Test generation

on:
  schedule:
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

concurrency:
  group: test-generation
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_URL: ${{ secrets.APP_URL }}
      APP_USER_EMAIL: ${{ secrets.APP_USER_EMAIL }}
      APP_USER_PASSWORD: ${{ secrets.APP_USER_PASSWORD }}
      APP_ALT_USER_EMAIL: ${{ secrets.APP_ALT_USER_EMAIL }}
      APP_ALT_USER_PASSWORD: ${{ secrets.APP_ALT_USER_PASSWORD }}
      ATLASSIAN_BASE_URL: ${{ secrets.ATLASSIAN_BASE_URL }}
      ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
      JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
      CONFLUENCE_SPACE_KEY: ${{ secrets.CONFLUENCE_SPACE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run test generation agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          CURSOR_GH_MCP: ${{ secrets.CURSOR_GH_MCP }}
        run: |
          agent -p --force --trust --output-format text "$(cat <<'EOF'
          Follow .cursor/rules/qa-orchestrator.mdc Backlog mode for the Jira project in JIRA_PROJECT_KEY.
          Process AT MOST ONE In Progress ticket without the tests-generated label.
          Read its linked Confluence page.
          Write the spec per the project Playwright conventions.
          Run the spec.
          If green, open one PR linked to the ticket and add the tests-generated label to the ticket.
          If red because of an app bug, stop and summarize; do not add the label.
          Use GitHub MCP via CURSOR_GH_MCP when available; otherwise use gh with GITHUB_TOKEN.
          Write only under tests/ and pages/.
          Never merge.
          EOF
          )"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-test-generation
          path: playwright-report/
          retention-days: 30
